{% extends "base.html" %}
{% block content %}
<h2>{{ t('action_add') }} {{ t('nav_plans') }}</h2>
<form method="post" action="/plans/add">
 <div class="mb-3"><label>{{ t('book_title') }}</label>
  <select name="book_id" class="form-select">{% for b in books %}<option value="{{ b.id }}">{{ b.title }}</option>{% endfor %}</select></div>
 <div class="mb-3"><label>计划人</label><input name="planner" class="form-control" required></div>
 <div class="mb-3"><label>开始日期</label><input name="start_date" type="date" class="form-control" required></div>
 <div class="mb-3"><label>结束日期</label><input name="end_date" type="date" class="form-control"></div>
 <div class="mb-3"><label>描述</label><textarea name="description" class="form-control"></textarea></div>
 <div class="mb-3"><label>优先级</label><select name="priority" class="form-select"><option>高</option><option selected>中</option><option>低</option></select></div>
 <button class="btn btn-primary">{{ t('action_save') }}</button>
</form>
{% endblock %}
