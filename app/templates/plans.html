{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between"><h2>{{ t('nav_plans') }}</h2>
<a href="/plans/add" class="btn btn-success">{{ t('action_add') }}</a></div>
<table class="table"><thead><tr><th>{{ t('book_title') }}</th><th>计划人</th><th>状态</th><th>{{ t('stats_completion') }}</th><th></th></tr></thead>
<tbody>
{% for p in plans %}<tr>
 <td><a href="/plans/{{ p.id }}">{{ p.book_title }}</a></td><td>{{ p.planner }}</td><td>{{ p.status }}</td>
 <td>{{ p.progress }}%</td>
 <td><form method="post" action="/plans/{{ p.id }}/delete" class="d-inline">
  <button class="btn btn-sm btn-danger">{{ t('action_delete') }}</button></form></td>
</tr>{% else %}<tr><td colspan="5" class="text-muted">暂无计划</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
