{% extends "base.html" %}
{% block content %}
<h2>{{ plan.book_title }}</h2>
<p>计划人：{{ plan.planner }} ｜ 状态：{{ plan.status }} ｜ 进度：{{ plan.progress }}%</p>
<p>{{ plan.description or '' }}</p>
<h4>任务</h4>
<ul class="list-group mb-3">
{% for t in tasks %}<li class="list-group-item d-flex justify-content-between">
 <span>{{ t.title }} <span class="badge bg-secondary">{{ t.status }}</span></span>
 <form method="post" action="/plans/{{ plan.id }}/task/{{ t.id }}/update">
  <input type="hidden" name="status" value="已完成"><button class="btn btn-sm btn-success">完成</button></form>
</li>{% else %}<li class="list-group-item text-muted">暂无任务</li>{% endfor %}
</ul>
<form method="post" action="/plans/{{ plan.id }}/task/add" class="row g-2">
 <div class="col"><input name="title" class="form-control" placeholder="任务标题" required></div>
 <div class="col"><input name="executor" class="form-control" placeholder="执行人"></div>
 <div class="col"><button class="btn btn-primary">{{ t('action_add') }}</button></div>
</form>
{% endblock %}
