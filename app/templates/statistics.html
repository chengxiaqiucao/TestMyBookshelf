{% extends "base.html" %}
{% block content %}
<h2>{{ t('nav_stats') }}</h2>
<div class="row g-3 mb-4">
 <div class="col-md-3"><div class="card"><div class="card-body">{{ t('stats_total_books') }}<h3>{{ stats.total_books }}</h3></div></div></div>
 <div class="col-md-3"><div class="card"><div class="card-body">已完成计划<h3>{{ stats.completed_plans }}</h3></div></div></div>
 <div class="col-md-3"><div class="card"><div class="card-body">{{ t('stats_completion') }}<h3>{{ stats.completion_rate }}%</h3></div></div></div>
</div>
<div class="row">
 <div class="col-md-6"><canvas id="statusChart"></canvas></div>
 <div class="col-md-6"><canvas id="monthlyChart"></canvas></div>
</div>
<div class="mt-4"><canvas id="heatmapChart"></canvas></div>
<a href="/statistics/export.csv" class="btn btn-outline-primary mt-3">导出 CSV</a>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
const c1 = echarts.init(document.getElementById('statusChart'));
c1.setOption({title:{text:'阅读状态'},series:[{type:'pie',data:{{ distribution|tojson }}}]});
const c2 = echarts.init(document.getElementById('monthlyChart'));
c2.setOption({title:{text:'月度趋势'},xAxis:{type:'category',data:{{ monthly.plans|map(attribute='month')|list|tojson }}},
 yAxis:{type:'value'},series:[{type:'line',data:{{ monthly.plans|map(attribute='count')|list|tojson }}}]});
const c3 = echarts.init(document.getElementById('heatmapChart'));
const hd = {{ heatmap|tojson }};
c3.setOption({title:{text:'24小时阅读热力图'},xAxis:{type:'category',data:Object.keys(hd)},
 yAxis:{type:'value'},series:[{type:'bar',data:Object.values(hd)}]});
</script>
{% endblock %}
