{% extends "base.html" %}
{% block content %}
<h2>{{ t('action_add') }} {{ t('nav_books') }}</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/books/add" enctype="multipart/form-data" class="was-validated">
 <div class="mb-3"><label>{{ t('book_title') }} *</label><input name="title" class="form-control" required></div>
 <div class="mb-3"><label>{{ t('book_author') }} *</label><input name="author" class="form-control" required></div>
 <div class="mb-3"><label>{{ t('book_publish_date') }}</label><input name="publish_date" type="date" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_purchase_date') }}</label><input name="purchase_date" type="date" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_purchaser') }}</label><input name="purchaser" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_price') }}</label><input name="purchase_price" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_category') }}</label><input name="category" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_desc') }}</label><textarea name="description" class="form-control"></textarea></div>
 <div class="mb-3"><label>{{ t('book_cover') }}</label><input name="cover_image" type="file" accept="image/*" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_status') }}</label>
  <select name="reading_status" class="form-select"><option>待读</option><option>正在读</option><option>已读</option></select></div>
 <div class="mb-3"><label>{{ t('book_storage') }}</label>
  <select name="storage_status" class="form-select"><option>在库</option><option>待购买</option><option>借入</option><option>借出</option><option>归档</option></select></div>
 <button class="btn btn-primary">{{ t('action_save') }}</button>
</form>
{% endblock %}
