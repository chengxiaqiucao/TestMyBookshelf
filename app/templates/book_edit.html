{% extends "base.html" %}
{% block content %}
<h2>{{ t('action_edit') }} {{ t('nav_books') }}</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/books/{{ book.id }}/edit" enctype="multipart/form-data">
 <div class="mb-3"><label>{{ t('book_title') }} *</label><input name="title" value="{{ book.title }}" class="form-control" required></div>
 <div class="mb-3"><label>{{ t('book_author') }} *</label><input name="author" value="{{ book.author }}" class="form-control" required></div>
 <div class="mb-3"><label>{{ t('book_publish_date') }}</label><input name="publish_date" value="{{ book.publish_date or '' }}" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_purchase_date') }}</label><input name="purchase_date" value="{{ book.purchase_date or '' }}" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_purchaser') }}</label><input name="purchaser" value="{{ book.purchaser or '' }}" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_price') }}</label><input name="purchase_price" value="{{ book.purchase_price or '' }}" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_category') }}</label><input name="category" value="{{ book.category or '' }}" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_desc') }}</label><textarea name="description" class="form-control">{{ book.description or '' }}</textarea></div>
 <div class="mb-3"><label>{{ t('book_cover') }}</label><input name="cover_image" type="file" class="form-control"></div>
 <div class="mb-3"><label>{{ t('book_status') }}</label>
  <select name="reading_status" class="form-select">
   {% for s in ['待读','正在读','已读'] %}<option {% if book.reading_status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
  </select></div>
 <div class="mb-3"><label>{{ t('book_storage') }}</label>
  <select name="storage_status" class="form-select">
   {% for s in ['在库','待购买','借入','借出','归档'] %}<option {% if book.storage_status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
  </select></div>
 <button class="btn btn-primary">{{ t('action_save') }}</button>
</form>
{% endblock %}
