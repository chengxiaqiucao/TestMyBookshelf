{% extends "base.html" %}
{% block content %}
<h2>{{ t('nav_register') }}</h2>
<form method="post" action="/register">
 <div class="mb-3"><label>用户名</label><input name="username" class="form-control" required></div>
 <div class="mb-3"><label>密码</label><input name="password" type="password" class="form-control" required></div>
 <div class="mb-3"><label>邮箱</label><input name="email" type="email" class="form-control"></div>
 <button class="btn btn-primary">{{ t('nav_register') }}</button>
</form>
{% endblock %}
